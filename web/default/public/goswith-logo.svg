  </defs>
  <!-- Rounded-square brand tile: restrained indigo → violet gradient -->
  <rect width="512" height="512" rx="116" fill="url(#gw-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#gw-sheen)"/>
